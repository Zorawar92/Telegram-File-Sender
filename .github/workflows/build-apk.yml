name: Build APK (arm64-v8a)

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "arena/ded7d25d-telegram-file-sender"
    tags:
      - "v*"
      - "V*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # L'SDK Android è già presente sulle runner ubuntu-latest: basta indicarlo a Gradle.
      # (android-actions/setup-android@v3 non funziona più sulle runner aggiornate.)
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # La cartella android/ è versionata: se la modifichi con `expo prebuild`,
      # committa il risultato. Qui la rigeneriamo solo se manca.
      - name: Prebuild (solo se android/ non esiste)
        run: |
          if [ ! -d android ]; then
            npx expo prebuild --platform android --no-install
          fi

      - name: Build APK (solo arm64-v8a)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Rinomina APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
             out/telegram-file-sender-arm64-v8a.apk

      - uses: actions/upload-artifact@v4
        with:
          name: telegram-file-sender-arm64-v8a
          path: out/telegram-file-sender-arm64-v8a.apk

      # Allega l'APK alla release quando il push è un tag v*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: out/telegram-file-sender-arm64-v8a.apk
