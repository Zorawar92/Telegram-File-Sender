name: Build APK (arm64-v8a)

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"
      - "V*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # L'SDK Android è già presente sulle runner ubuntu-latest: basta indicarlo a Gradle.
      # (android-actions/setup-android@v3 non funziona più sulle runner aggiornate.)
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # La cartella android/ è versionata: se la modifichi con `expo prebuild`,
      # committa il risultato. Qui la rigeneriamo solo se manca.
      - name: Prebuild (solo se android/ non esiste)
        run: |
          if [ ! -d android ]; then
            npx expo prebuild --platform android --no-install
          fi

      - name: Build APK (solo arm64-v8a)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      # Controllo di sicurezza: se il manifest finale perde un permesso o il servizio
      # del backup, l'APK si installa ma il backup automatico non parte più.
      - name: Verifica manifest (permessi e servizio del backup)
        run: |
          manifest=$(find android/app/build/intermediates -name AndroidManifest.xml -path '*merged_manifest*' | head -1)
          echo "Manifest: $manifest"
          grep -E "uses-permission|BackupRunService|foregroundServiceType|BackupAlarmReceiver|BackupBootReceiver" "$manifest"
          for entry in USE_EXACT_ALARM SCHEDULE_EXACT_ALARM FOREGROUND_SERVICE_DATA_SYNC BackupRunService "foregroundServiceType=\"dataSync\"" BackupAlarmReceiver BackupBootReceiver RECEIVE_BOOT_COMPLETED; do
            grep -q "$entry" "$manifest" || { echo "::error::Manca $entry nel manifest finale"; exit 1; }
          done

      - name: Rinomina APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
             out/telegram-file-sender-arm64-v8a.apk

      - uses: actions/upload-artifact@v4
        with:
          name: telegram-file-sender-arm64-v8a
          path: out/telegram-file-sender-arm64-v8a.apk

      # Allega l'APK alla release quando il push è un tag (v1.3.1 o V1.3.1)
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
        with:
          files: out/telegram-file-sender-arm64-v8a.apk
