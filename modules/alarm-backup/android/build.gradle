plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.alarmbackup'
version = '1.0.0'

android {
  namespace "expo.modules.alarmbackup"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // WorkManager: il risveglio della sveglia accoda un lavoro che sopravvive
  // all'uscita dal processo (stessa versione usata da expo-background-task).
  implementation 'androidx.work:work-runtime-ktx:2.9.1'
  // BackgroundTaskScheduler è il pezzo di expo-background-task che esegue davvero
  // i task JS registrati: lo riusiamo, così non serve un secondo entry point JS.
  implementation project(':expo-background-task')
}
